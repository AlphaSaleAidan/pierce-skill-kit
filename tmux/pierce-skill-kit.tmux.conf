# Pierce Skill Kit tmux settings (install.sh sources this from ~/.tmux.conf).
set -g mouse on
set -g base-index 1
set -g renumber-windows on
set -g history-limit 100000
set -g status off
# Each pane's bottom border shows its folder; the lead's shows a red LEADER marker so you always know
# which window is the manager. (Change "Lead" if you changed LK_LEAD_WINDOW.)
set -g pane-border-status bottom
set -g pane-border-format "#{?#{==:#W,Lead},#[bg=colour160#,fg=white#,bold] LEADER #[default] , #{b:pane_current_path} }"
# Mouse goes to tmux, not to Claude: the wheel scrolls the full history, a drag selects and copies.
unbind -n MouseDown1Pane
bind -n MouseDown1Pane select-pane -t =
bind -n MouseDrag1Pane if -F '#{pane_in_mode}' 'send -X begin-selection' 'copy-mode -M'
bind -n WheelUpPane copy-mode -e \; send -X -N 3 scroll-up
# Copy to your local clipboard over SSH via OSC 52 (works in iTerm2, kitty, WezTerm, Windows Terminal, most others).
set -s set-clipboard on
bind -T copy-mode MouseDragEnd1Pane send -X copy-selection-and-cancel
# macOS Terminal.app ignores OSC 52. If you have an SSH path back to the Mac, use this line instead:
# bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "ssh -p 2222 me@localhost pbcopy"
