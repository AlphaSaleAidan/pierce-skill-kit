# Pierce Skill Kit tmux settings (install.sh sources this from ~/.tmux.conf).
set -g mouse on
set -g base-index 1
set -g renumber-windows on
set -g history-limit 100000
set -g status off
# Each pane's bottom border shows its folder; the lead's shows a red LEADER marker so you always know
# which window is the manager. (Change "Lead" if you changed LK_LEAD_WINDOW.)
set -g pane-border-status bottom
# Quiet borders and selection colour (tmux's defaults are bright green).
set -g pane-border-style fg=colour236
set -g pane-active-border-style fg=colour238
set -g mode-style bg=colour24,fg=colour255
set -g pane-border-format "#{?#{==:#W,Lead},#[bg=colour160#,fg=white#,bold] LEADER #[default] , #{b:pane_current_path} }"
# Mouse goes to tmux, not to Claude: the wheel scrolls the full history, a drag selects and copies.
unbind -n MouseDown1Pane
bind -n MouseDown1Pane select-pane -t =
bind -n MouseDrag1Pane if -F '#{pane_in_mode}' 'send -X begin-selection' 'copy-mode -M'
bind -n WheelUpPane copy-mode -e \; send -X -N 3 scroll-up
# Copy to your local clipboard over SSH via OSC 52 (works in iTerm2, kitty, WezTerm, Windows Terminal, most others).
set -s set-clipboard on
# Copy on release WITHOUT leaving scroll mode (leaving it is what made the view jump to the bottom).
# Click clears the selection; q or Esc leaves scroll mode.
bind -T copy-mode MouseDragEnd1Pane send -X copy-selection-no-clear
bind -T copy-mode MouseDown1Pane select-pane \; send -X clear-selection
# Typing while still in scroll mode just leaves it: any ordinary key exits instead of opening tmux's jump/search
# prompts (g = goto line, f/F/t/T = jump to char, r/R = refresh/rectangle). Arrows, PgUp/PgDn, wheel and q still work.
set -g mode-keys emacs     # keep these bindings in effect even when EDITOR mentions vi
unbind -T copy-mode g
unbind -T copy-mode f
unbind -T copy-mode F
unbind -T copy-mode t
unbind -T copy-mode T
unbind -T copy-mode r
unbind -T copy-mode R
bind -T copy-mode Any send -X cancel
# macOS Terminal.app ignores OSC 52. If you have an SSH path back to the Mac, use this line instead:
# bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-no-clear "ssh -p 2222 me@localhost pbcopy"
