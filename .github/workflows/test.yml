name: install-test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:stable -S warning \
            /mnt/install.sh /mnt/bin/lead /mnt/bin/tab-view /mnt/bin/claude-tab /mnt/bin/brief-send /mnt/bin/report \
            /mnt/bin/order /mnt/bin/heavy /mnt/bin/tab-watch /mnt/bin/lead-daily /mnt/bin/macos/mac-tab \
            /mnt/bin/macos/mac-close-dead /mnt/bin/macos/hub-check /mnt/hooks/lead-no-worker-agents.sh \
            /mnt/tests/smoke.sh /mnt/tests/hook-test.sh /mnt/get.sh /mnt/bin/lk-doctor /mnt/mods/install.sh \
            /mnt/mods/extras.sh /mnt/mods/statusline/statusline.sh /mnt/hooks/review-gate.sh /mnt/hooks/mail-no-links.sh \
            /mnt/tests/get-test.sh /mnt/tests/update-test.sh /mnt/tests/mods-test.sh /mnt/tests/skills-test.sh /mnt/bin/skill-add \
            /mnt/bin/claude-acct /mnt/tests/accounts-test.sh /mnt/mods/bridge/bridge /mnt/mods/bridge/test/e2e.sh \
            /mnt/bin/lk-config /mnt/mods/agent-board/bin/health.sh /mnt/mods/ruflo/apply.sh \
            /mnt/skills/remote-gpu-render/scripts/link_watch.sh /mnt/skills/studio-vfx/tools/encode_alpha.sh \
            /mnt/mods/brain-loop/bin/brain-loop /mnt/mods/brain-loop/bin/stuck-check /mnt/tests/brain-loop-test.sh \
            /mnt/examples/brain-loop-inputs/make-vault.sh \
            /mnt/bin/lead-say /mnt/bin/leader /mnt/tests/lead-tools-test.sh
      - name: hook test
        run: sh tests/hook-test.sh
      - name: skill routing + recommender
        run: sh tests/skills-test.sh
      - name: fresh-install smoke test (clean container)
        run: docker run --rm -v "$PWD:/kit:ro" debian:stable-slim sh /kit/tests/smoke.sh
  one-liner:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ["ubuntu:24.04", "debian:12"]
    steps:
      - uses: actions/checkout@v4
      - name: get.sh end to end on ${{ matrix.image }} (dry run, install, re-run, doctor)
        run: docker run --rm -v "$PWD:/kit:ro" ${{ matrix.image }} sh /kit/tests/get-test.sh
  update-and-mods:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tmux copy + lead update
        run: docker run --rm -v "$PWD:/kit:ro" debian:stable-slim sh /kit/tests/update-test.sh
      - name: two Claude accounts (claude-acct, claude-tab -a)
        run: docker run --rm -v "$PWD:/kit:ro" debian:stable-slim sh /kit/tests/accounts-test.sh
      - name: mods install/uninstall round trip
        run: docker run --rm -v "$PWD:/kit:ro" debian:stable-slim sh /kit/tests/mods-test.sh
      - name: lead tools (report-check, tab-sweep, job watchdog, lead-say busy checks, dtach lead)
        run: docker run --rm -v "$PWD:/kit:ro" debian:stable-slim sh /kit/tests/lead-tools-test.sh
      - name: brain-loop (vault, router, plan-grade, MCP, page, hook, stuck-check) on fake data
        run: docker run --rm -v "$PWD:/kit:ro" debian:stable-slim sh /kit/tests/brain-loop-test.sh
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bridge end to end (server + Mac/Linux client + PowerShell client containers)
        run: sh mods/bridge/test/e2e.sh
